<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Batlha de Robôs - Ifes campus Linhares</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; background:#0f172a; color:#e5e7eb; margin:0; padding:20px; }
    h1 { color:#38bdf8; }
    .match { background:#1f2937; margin:10px 0; padding:10px; border-radius:6px; }
    .row { display:flex; justify-content:space-between; }
    .winner { color:#22c55e; font-weight:bold; }
  </style>
  <script src="https://www.gstatic.com/charts/loader.js"></script>
</head>
<body>
  <h1>Torneio de Robôs — Atualizado pelo Google Sheets</h1>
  <div id="matches">Carregando lutas...</div>

<script>
const SHEET_ID = "1FD1OLXl_OHg7KAOP1ksviNWIvtf_UNz9NntjUhAZ5X8"; // <-- troque pelo ID da sua planilha
const RANGE = "A2:G100"; // ajusta conforme o tamanho da sua tabela

function loadSheet() {
  const query = new google.visualization.Query(
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=Sheet1&range=${RANGE}`
  );
  query.send(handleResponse);
}

function handleResponse(response) {
  if (response.isError()) {
    document.getElementById("matches").innerHTML = "Erro ao carregar planilha.";
    return;
  }
  const data = response.getDataTable();
  let html = "";
  for (let i = 0; i < data.getNumberOfRows(); i++) {
    const roboA = data.getValue(i,1);
    const placarA = data.getValue(i,2);
    const roboB = data.getValue(i,3);
    const placarB = data.getValue(i,4);
    const horario = data.getValue(i,5);
    const vencedor = data.getValue(i,6);

    html += `<div class="match">
      <div class="row"><span>${roboA} (${placarA})</span> <span>${roboB} (${placarB})</span></div>
      <div class="row"><span>Horário: ${horario}</span> <span class="winner">Vencedor: ${vencedor}</span></div>
    </div>`;
  }
  document.getElementById("matches").innerHTML = html;
}

google.charts.load('current', {'packages':['table']});
google.charts.setOnLoadCallback(() => {
  loadSheet();
  // Atualiza automaticamente a cada 60 segundos
  setInterval(loadSheet, 60000);
});
</script>
</body>
</html>
